terrascope:
  llm:
    provider: ollama
    base_url: http://localhost:11434
    model: qwen2.5-coder:7b
    embedding_model: nomic-embed-text
    temperature: 0.0
    max_tokens: 2048
    context_window: 8192
  grounding:
    mode: strict
    require_source_citation: true
    min_confidence_threshold: 0.7
    max_retrieval_chunks: 8
    chunk_overlap_tokens: 50
  vector_store:
    type: chromadb
    persist_path: ./data/chromadb
  server:
    host: 127.0.0.1
    port: 8000
    reload: true
  ui:
    port: 5173
    theme: dark
  policy:
    # Org-accepted checkov suppressions (Priority 5 gate). Each entry is a
    # checkov check_id, e.g. CKV_GCP_62. Empty by default -- nothing is
    # suppressed until a curator explicitly adds an org-approved exception.
    skip_checks: []
  scenario_generator:
    terraform_bin: terraform
    tf_cli_config_file: ''
    max_fix_iters: 3
    run_terraform_test: true
repos:
- name: terraform-google-bigquery
  display_name: BigQuery
  local_path: ./repos/terraform-google-bigquery
  gcp_product: bigquery
  description: Terraform modules for Google BigQuery datasets, tables, IAM
  enabled: true
- name: terraform-google-cloud-storage
  display_name: Cloud Storage
  local_path: ./repos/terraform-google-gcs
  gcp_product: storage
  description: Terraform modules for Google Cloud Storage buckets
  enabled: true
- name: terraform-google-dataflow
  display_name: Dataflow
  local_path: ./repos/terraform-google-dataflow
  gcp_product: dataflow
  description: Terraform modules for Google Dataflow pipelines
  enabled: true
gcp_products:
  filestore:
    apis:
    - file.googleapis.com
    common_roles:
    - roles/file.editor
    - roles/file.viewer
    provider_resources:
    - google_filestore_instance
    - google_filestore_backup
    - google_filestore_snapshot
  bigquery:
    apis:
    - bigquery.googleapis.com
    - bigqueryconnection.googleapis.com
    common_roles:
    - roles/bigquery.admin
    - roles/bigquery.dataEditor
    - roles/bigquery.dataViewer
    provider_resources:
    - google_bigquery_dataset
    - google_bigquery_table
    - google_bigquery_iam_binding
  storage:
    apis:
    - storage.googleapis.com
    common_roles:
    - roles/storage.admin
    - roles/storage.objectAdmin
    - roles/storage.objectViewer
    provider_resources:
    - google_storage_bucket
    - google_storage_bucket_iam_binding
    - google_storage_bucket_object
  dataflow:
    apis:
    - dataflow.googleapis.com
    - storage.googleapis.com
    common_roles:
    - roles/dataflow.admin
    - roles/dataflow.worker
    provider_resources:
    - google_dataflow_job
    - google_dataflow_flex_template_job
  pubsub:
    apis:
    - pubsub.googleapis.com
    common_roles:
    - roles/pubsub.admin
    - roles/pubsub.publisher
    - roles/pubsub.subscriber
    provider_resources:
    - google_pubsub_topic
    - google_pubsub_subscription
    - google_pubsub_topic_iam_binding
  dataproc:
    apis:
    - dataproc.googleapis.com
    common_roles:
    - roles/dataproc.admin
    - roles/dataproc.worker
    provider_resources:
    - google_dataproc_cluster
    - google_dataproc_job
    - google_dataproc_autoscaling_policy
  composer:
    apis:
    - composer.googleapis.com
    common_roles:
    - roles/composer.admin
    - roles/composer.worker
    provider_resources:
    - google_composer_environment
  spanner:
    apis:
    - spanner.googleapis.com
    common_roles:
    - roles/spanner.admin
    - roles/spanner.databaseAdmin
    provider_resources:
    - google_spanner_instance
    - google_spanner_database
    - google_spanner_database_iam_binding
  bigtable:
    apis:
    - bigtable.googleapis.com
    - bigtableadmin.googleapis.com
    common_roles:
    - roles/bigtable.admin
    - roles/bigtable.reader
    provider_resources:
    - google_bigtable_instance
    - google_bigtable_table
    - google_bigtable_instance_iam_binding
